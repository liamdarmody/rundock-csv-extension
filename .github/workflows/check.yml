name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version tests read every tag's manifest, so the history and
          # the tags have to be here, not a single shallow commit.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - name: The pushed tag names the manifest's version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.js "$GITHUB_REF_NAME"
